name: Build Production APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'Production Release'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Determine Versioning
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME=$(echo "$TAG_NAME" | sed 's/^[vV]//')
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NAME"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            CALC_CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH * 10 + RUN_NUM))
            
            echo "VERSION_NAME=$VER_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$CALC_CODE" >> $GITHUB_ENV
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            VER_NAME="1.0.${RUN_NUM}"
            CALC_CODE="${RUN_NUM}"
            
            echo "VERSION_NAME=$VER_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$CALC_CODE" >> $GITHUB_ENV
            echo "tag_name=v$VER_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEYSTORE_PATH="${{ github.workspace }}/release.keystore"
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p app/build/outputs/apk/release
          mkdir -p release

          echo "Searching for generated release APK..."
          FOUND_APK=$(find . -type f -path "*/build/outputs/apk/*release/*.apk" ! -name "ISP-Billing-Release.apk" | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "Searching all APK files for release variant..."
            FOUND_APK=$(find . -type f -name "*.apk" ! -name "ISP-Billing-Release.apk" | grep -i "release" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ]; then
            echo "ERROR: Release APK could not be found!"
            exit 1
          fi

          echo "Discovered APK path: $FOUND_APK"
          cp "$FOUND_APK" "release/ISP-Billing-Release.apk"
          cp "$FOUND_APK" "app/build/outputs/apk/release/ISP-Billing-Release.apk"

      - name: Verify Release APK
        run: |
          APK_PATH="release/ISP-Billing-Release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Production APK file missing!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH" || stat -f%z "$APK_PATH")
          echo "Production APK File Size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Generated APK is under 1MB and appears incomplete or invalid!"
            exit 1
          fi

          echo "Testing APK ZIP structure..."
          unzip -t "$APK_PATH" > /dev/null
          echo "Production APK structure verification passed!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISP-Billing-APK
          path: release/ISP-Billing-Release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release/ISP-Billing-Release.apk
          name: ${{ github.event.inputs.release_title || steps.versioning.outputs.tag_name }}
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
