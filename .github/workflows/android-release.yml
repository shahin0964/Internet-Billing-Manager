name: Android Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New Release'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEYSTORE_PATH="release.keystore"
          fi
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Locate and Rename Output APK
        run: |
          mkdir -p app/build/outputs/apk/release
          mkdir -p release

          echo "Searching for generated release APK..."
          FOUND_APK=$(find . -type f -path "*/build/outputs/apk/*release/*.apk" ! -name "InternetBillManagement.apk" | head -n 1)

          if [ -z "$FOUND_APK" ]; then
            echo "Searching all APK files for release variant..."
            FOUND_APK=$(find . -type f -name "*.apk" ! -name "InternetBillManagement.apk" | grep -i "release" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ]; then
            echo "ERROR: Release APK could not be found!"
            echo "Searched paths:"
            echo " - **/build/outputs/apk/*release/*.apk"
            echo " - **/build/outputs/apk/**/*.apk"
            exit 1
          fi

          echo "Discovered APK path: $FOUND_APK"

          cp "$FOUND_APK" "app/build/outputs/apk/release/InternetBillManagement.apk"
          cp "$FOUND_APK" "release/InternetBillManagement.apk"

          echo "Final renamed APK path: app/build/outputs/apk/release/InternetBillManagement.apk"
          echo "Final renamed APK path: release/InternetBillManagement.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/InternetBillManagement.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/InternetBillManagement.apk
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
